# BioGPT (347M): merge AFTER smoke.yaml when running a smoke test.
# Shares the existing data, client partitions and retrieval assignments with Qwen.
model:
  name: microsoft/biogpt
  short_name: biogpt
  max_seq_len: 1024
  end_of_turn_token: null             # use the tokenizer's EOS
  attn_implementation: eager

prompt:
  format: text                       # pretrained completion model, no chat template

lora:
  target_modules: [q_proj, k_proj, v_proj, out_proj]
